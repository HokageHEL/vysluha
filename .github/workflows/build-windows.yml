name: Build Desktop Apps (Windows .exe & macOS .dmg)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Apps (Tauri & Electron)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain (for Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Prepare Code Signing Certificate
        id: prepare_cert
        shell: pwsh
        run: |
          if ("${{ secrets.CSC_LINK }}" -ne "") {
            Write-Host "Using certificate from GitHub Secrets."
            if ("${{ secrets.CSC_LINK }}".Length -gt 260) {
              [IO.File]::WriteAllBytes("$PWD\certificate.pfx", [Convert]::FromBase64String("${{ secrets.CSC_LINK }}"))
              Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$PWD\certificate.pfx"
            }
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}"
          } else {
            Write-Host "Creating self-signed Code Signing certificate..."
            $certPassword = "VysluhaSecurePassword2026!"
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Вислуга 360, O=HokageHEL, OU=Desktop" `
              -KeySpec Signature `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)

            $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$PWD\certificate.pfx" -Password $securePassword
            Export-Certificate -Cert $cert -FilePath "$PWD\Vysluha360_Certificate.cer"

            Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$PWD\certificate.pfx"
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=$certPassword"
          }

      - name: Build Electron (.exe Portable & Setup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Build Tauri (.exe Setup ~4MB)
        run: npx tauri build --bundles nsis

      - name: Prepare and Sign Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts"

          # Copy Electron binaries
          if (Test-Path "release-electron") {
            Get-ChildItem -Path "release-electron\*.exe" | ForEach-Object {
              Copy-Item $_.FullName -Destination "artifacts\"
            }
          }

          # Copy Tauri setup installer
          if (Test-Path "src-tauri\target\release\bundle\nsis") {
            Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | ForEach-Object {
              $destName = "artifacts\Вислуга 360 Tauri Setup 1.0.0.exe"
              Copy-Item $_.FullName -Destination $destName
            }
          }

          # Copy Tauri raw portable binary if exists
          if (Test-Path "src-tauri\target\release\vysluha.exe") {
            Copy-Item "src-tauri\target\release\vysluha.exe" -Destination "artifacts\Вислуга 360 Tauri Portable 1.0.0.exe"
          }

          # Copy certificate and helper
          if (Test-Path "Vysluha360_Certificate.cer") {
            Copy-Item "Vysluha360_Certificate.cer" -Destination "artifacts\"
          }
          if (Test-Path "scripts\install-cert.bat") {
            Copy-Item "scripts\install-cert.bat" -Destination "artifacts\"
          }

          # Sign all artifacts with Authenticode & RFC 3161 Timestamp
          $pfxPath = "$PWD\certificate.pfx"
          if (Test-Path $pfxPath) {
            $certPassword = "VysluhaSecurePassword2026!"
            $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $certPassword, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            
            Get-ChildItem -Path "artifacts\*.exe" | ForEach-Object {
              Write-Host "Signing $($_.FullName)..."
              try {
                Set-AuthenticodeSignature -FilePath $_.FullName `
                  -Certificate $pfx `
                  -TimestampServer "http://timestamp.digicert.com" `
                  -HashAlgorithm SHA256
              } catch {
                Write-Warning "Timestamp server failed, signing without timestamp..."
                Set-AuthenticodeSignature -FilePath $_.FullName `
                  -Certificate $pfx `
                  -HashAlgorithm SHA256
              }
            }
          }

          Write-Host "Prepared artifacts:"
          Get-ChildItem -Path "artifacts"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vysluha-360-windows-apps
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS App (Tauri .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Build Tauri macOS (.dmg & .app)
        run: npx tauri build --bundles dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vysluha-360-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

